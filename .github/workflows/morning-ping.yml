name: Morning email keep-alive

on:
  schedule:
    # 11:00 UTC (summer) and 12:00 UTC (winter) are 7:00 AM Eastern.
    - cron: "5 10-12 * * *"
  workflow_dispatch:

concurrency:
  group: morning-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Keep the worker awake through the 7am Eastern send
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "WORKER_URL repository variable is not set" >&2
            exit 1
          fi

          deadline=$((SECONDS + 3000))
          last_ok=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -fsS --max-time 90 --retry 3 --retry-delay 15 "$WORKER_URL/health" > /dev/null; then
              last_ok=1
              echo "$(date -u +%H:%M:%S) worker is awake"
            else
              last_ok=0
              echo "$(date -u +%H:%M:%S) ping failed" >&2
            fi
            sleep 120
          done

          if [ "$last_ok" -ne 1 ]; then
            echo "Worker stopped responding; morning emails may not have been sent" >&2
            exit 1
          fi
