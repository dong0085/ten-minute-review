name: Morning email ping

on:
  schedule:
    - cron: "0 5-14 * * *"
  workflow_dispatch:

concurrency:
  group: morning-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake worker so the scheduler sends due morning emails
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "WORKER_URL repository variable is not set" >&2
            exit 1
          fi

          echo "Pinging $WORKER_URL/health"
          curl -fsS --max-time 180 --retry 3 --retry-delay 20 "$WORKER_URL/health"
